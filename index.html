<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KüpKüp - Parametrik İmar ve Mimari Ön Etüt Platformu</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- Three.js (3B Sahne) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Proj4js (ITRF96 / Coğrafi Dönüşüm) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <!-- ClipperLib (Poligon Ofsetleme / Çekme Payları) -->
  <script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; user-select: none; }
    #map { position: absolute; inset: 0; z-index: 0; }
    #cad-canvas { position: absolute; inset: 0; z-index: 10; cursor: crosshair; }
    #three-container { position: absolute; inset: 0; z-index: 20; display: none; background: #0f172a; }
    .glass-panel { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(8px); border: 1px solid rgba(51, 65, 85, 0.8); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen flex flex-col font-sans">

  <!-- 1. TAPU VE PROJE BARI (ÜST) -->
  <header class="h-12 glass-panel z-30 flex items-center justify-between px-4 text-xs">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5 font-bold tracking-wider text-amber-400 text-sm">
        <span class="w-3 h-3 bg-amber-400 rounded-sm"></span> KüpKüp CAD
      </div>
      <div class="h-4 w-px bg-slate-700 mx-1"></div>
      
      <!-- TKGM Arayüzü -->
      <div class="flex items-center gap-2">
        <select id="sel-il" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 outline-none text-slate-200">
          <option value="16">Bursa</option>
          <option value="34">İstanbul</option>
          <option value="06">Ankara</option>
          <option value="35">İzmir</option>
          <option value="10">Balıkesir</option>
          <option value="77">Yalova</option>
        </select>
        <input type="text" id="inp-ilce" placeholder="İlçe (Ör: Nilüfer)" value="Nilüfer" class="w-24 bg-slate-900 border border-slate-700 rounded px-2 py-1 outline-none text-slate-200" />
        <input type="text" id="inp-mahalle" placeholder="Mahalle" value="İhsaniye" class="w-24 bg-slate-900 border border-slate-700 rounded px-2 py-1 outline-none text-slate-200" />
        <input type="text" id="inp-ada" placeholder="Ada" value="2145" class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 outline-none text-slate-200" />
        <input type="text" id="inp-parsel" placeholder="Parsel" value="12" class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 outline-none text-slate-200" />
        <button id="btn-sorgula" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-3 py-1 rounded transition flex items-center gap-1 shadow">
          <i data-lucide="search" class="w-3.5 h-3.5"></i> Parseli Getir
        </button>
      </div>
    </div>

    <!-- Altlık ve Pratik Araçlar -->
    <div class="flex items-center gap-2">
      <button id="btn-wizard" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded flex items-center gap-1 shadow">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Sihirbaz
      </button>
      <div class="h-4 w-px bg-slate-700 mx-1"></div>
      <button id="btn-toggle-layer" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2 py-1 rounded flex items-center gap-1">
        <i data-lucide="layers" class="w-3.5 h-3.5 text-sky-400"></i> Uydu/Vektör
      </button>
    </div>
  </header>

  <!-- 2. İMAR ARAÇ VE KISIT BARI -->
  <section class="h-10 glass-panel z-30 flex items-center justify-between px-4 text-xs border-t-0">
    <div class="flex items-center gap-3">
      <!-- TAKS / KAKS -->
      <div class="flex items-center gap-1.5">
        <label class="text-slate-400">TAKS:</label>
        <input type="number" id="inp-taks" step="0.05" value="0.40" class="w-14 bg-slate-950 border border-slate-700 rounded px-1.5 py-0.5 text-center text-slate-200" />
        <label class="text-slate-400 ml-2">KAKS:</label>
        <input type="number" id="inp-kaks" step="0.1" value="1.20" class="w-14 bg-slate-950 border border-slate-700 rounded px-1.5 py-0.5 text-center text-slate-200" />
      </div>

      <div class="h-4 w-px bg-slate-700"></div>

      <!-- Kot Yönetimi -->
      <div class="flex items-center gap-1.5">
        <label class="text-slate-400">Bahçe:</label>
        <input type="text" id="inp-kot-bahce" value="±0.00" class="w-14 bg-slate-950 border border-slate-700 rounded px-1.5 py-0.5 text-center text-slate-200" />
        <label class="text-slate-400 ml-1">Subasman:</label>
        <input type="text" id="inp-kot-zemin" value="+0.50m" class="w-16 bg-slate-950 border border-slate-700 rounded px-1.5 py-0.5 text-center text-slate-200" />
      </div>

      <div class="h-4 w-px bg-slate-700"></div>

      <!-- Kat Dağılım Çubuğu -->
      <div class="flex items-center gap-1" id="floor-tabs">
        <button class="px-2 py-0.5 bg-amber-500/20 text-amber-300 rounded border border-amber-500/40 font-medium active-floor" data-floor="0">Zemin (h:3.0m)</button>
        <button class="px-2 py-0.5 bg-slate-900 text-slate-400 hover:text-slate-200 rounded border border-slate-800" data-floor="1">1. Kat (h:3.0m)</button>
        <button class="px-2 py-0.5 bg-slate-900 text-slate-400 hover:text-slate-200 rounded border border-slate-800" data-floor="2">Çatı</button>
      </div>

      <div class="h-4 w-px bg-slate-700"></div>

      <!-- Kural Motoru ve İmar Uyarı -->
      <div class="flex items-center gap-2">
        <button id="btn-yonetmelik" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 rounded px-2 py-0.5 flex items-center gap-1">
          <i data-lucide="book-open" class="w-3.5 h-3.5 text-sky-400"></i> İmar Notu
        </button>

        <div class="flex items-center gap-1.5 bg-slate-950 border border-slate-800 rounded px-2 py-0.5">
          <span class="text-slate-400 font-medium">Kurallar:</span>
          <button id="btn-toggle-rules" class="relative inline-flex h-4 w-8 items-center rounded-full bg-slate-700 transition">
            <span id="rules-toggle-thumb" class="inline-block h-3 w-3 transform rounded-full bg-white transition translate-x-0.5"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Metraj Özeti -->
    <div class="flex items-center gap-3 text-[11px]">
      <div>Arsa: <span id="lbl-arsa" class="font-bold text-slate-200">650.00 m²</span></div>
      <div>Çekme İçi: <span id="lbl-cekme" class="font-bold text-sky-400">345.20 m²</span></div>
      <div>İzin Taban (TAKS): <span id="lbl-izin" class="font-bold text-emerald-400">260.00 m²</span></div>
      <div>Kütle: <span id="lbl-kutle" class="font-bold text-amber-400">180.00 m²</span></div>
    </div>
  </section>

  <!-- 3. ANA ÇALIŞMA ALANI -->
  <main class="relative flex-1 w-full h-full overflow-hidden">
    <div id="map"></div>
    <canvas id="cad-canvas"></canvas>
    <div id="three-container"></div>

    <!-- Sol Tipoloji ve Kütle Paneli -->
    <aside class="absolute left-3 top-3 w-64 glass-panel rounded-lg p-3 z-30 flex flex-col gap-2.5 text-xs shadow-2xl">
      <div class="font-semibold text-slate-300 border-b border-slate-700/60 pb-1.5 flex justify-between items-center">
        <span>PARAMETRİK KÜTLE</span>
        <span class="text-[10px] text-amber-400">V11 PRO</span>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-slate-400">Tipoloji Modeli:</label>
        <div class="grid grid-cols-3 gap-1 text-center">
          <button class="btn-tipo active bg-slate-800 border border-slate-600 py-1 rounded" data-tipo="tek">Tek Blok</button>
          <button class="btn-tipo bg-slate-900 border border-slate-800 py-1 rounded text-slate-400" data-tipo="ikiz">İkiz</button>
          <button class="btn-tipo bg-slate-900 border border-slate-800 py-1 rounded text-slate-400" data-tipo="ayrik">Ayrık</button>
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-slate-400">Form Şablonu:</label>
        <div class="grid grid-cols-4 gap-1 text-center font-bold">
          <button class="btn-form active bg-slate-800 border border-slate-600 py-1 rounded text-amber-300" data-form="RECT">RECT</button>
          <button class="btn-form bg-slate-900 border border-slate-800 py-1 rounded text-slate-400" data-form="L">L</button>
          <button class="btn-form bg-slate-900 border border-slate-800 py-1 rounded text-slate-400" data-form="U">U</button>
          <button class="btn-form bg-slate-900 border border-slate-800 py-1 rounded text-slate-400" data-form="T">T</button>
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-slate-400">Kenar Çekme Payları (m):</label>
        <div class="grid grid-cols-3 gap-1">
          <div><span class="text-[10px] text-slate-500">Ön/Yol</span><input id="set-on" type="number" value="5.0" step="0.5" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-center" /></div>
          <div><span class="text-[10px] text-slate-500">Yanlar</span><input id="set-yan" type="number" value="3.0" step="0.5" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-center" /></div>
          <div><span class="text-[10px] text-slate-500">Arka</span><input id="set-arka" type="number" value="3.0" step="0.5" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-center" /></div>
        </div>
      </div>

      <button id="btn-generate" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-1.5 rounded transition flex justify-center items-center gap-1 shadow">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 10 Varyasyon Türet
      </button>

      <div id="warning-box" class="hidden text-[10px] text-amber-300 bg-amber-950/40 border border-amber-800/80 p-2 rounded leading-tight flex items-start gap-1">
        <i data-lucide="alert-triangle" class="w-3.5 h-3.5 shrink-0"></i>
        <span id="warning-text">Kütle çekme sınırına temas ediyor.</span>
      </div>
    </aside>

    <!-- Sağ Üst Görüntüleme ve CAD Export -->
    <div class="absolute right-3 top-3 z-30 flex flex-col gap-2">
      <div class="glass-panel rounded-lg p-1 flex items-center gap-1">
        <button id="btn-toggle-3d" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-xs flex items-center gap-1">
          <i data-lucide="box" class="w-3.5 h-3.5 text-amber-400"></i> 3B Kütle
        </button>
        <button id="btn-plan-view" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded text-xs flex items-center gap-1">
          <i data-lucide="compass" class="w-3.5 h-3.5 text-sky-400"></i> İç Plan (90°)
        </button>
      </div>

      <!-- Dışa Aktarma -->
      <div class="glass-panel rounded-lg p-2 flex flex-col gap-1 text-xs">
        <div class="text-[10px] text-slate-400 font-semibold mb-0.5">DIŞA AKTAR (CAD/BIM)</div>
        <button id="btn-export-dxf" class="w-full bg-slate-900 hover:bg-slate-800 text-left px-2 py-1 rounded text-slate-200 flex items-center justify-between border border-slate-800">
          <span>AutoCAD (.DXF)</span>
          <i data-lucide="download" class="w-3 h-3 text-slate-400"></i>
        </button>
        <button id="btn-export-obj" class="w-full bg-slate-900 hover:bg-slate-800 text-left px-2 py-1 rounded text-slate-200 flex items-center justify-between border border-slate-800">
          <span>3D Mesh (.OBJ)</span>
          <i data-lucide="download" class="w-3 h-3 text-slate-400"></i>
        </button>
      </div>
    </div>

    <!-- Sağ Alt Varyasyon Galerisi -->
    <div id="variation-gallery" class="absolute right-3 bottom-3 z-30 flex gap-2 overflow-x-auto max-w-xl p-2 glass-panel rounded-lg">
      <!-- 10 varyasyon kartı dinamik olarak buraya eklenecek -->
    </div>
  </main>

  <script>
    lucide.createIcons();

    // -------------------------------------------------------------
    // 1. UYGULAMA DURUMU (STATE)
    // -------------------------------------------------------------
    const App = {
      rulesActive: false,
      is3D: false,
      isPlanAligned: false,
      selectedForm: 'RECT',
      selectedTipo: 'tek',
      taks: 0.40,
      kaks: 1.20,
      setbacks: { on: 5.0, yan: 3.0, arka: 3.0 },
      // Varsayılan Örnek Parsel Koordinatları (Nilüfer / Bursa Metrik Ofsetli)
      parcelWGS: [
        [28.9812, 40.2105],
        [28.9818, 40.2108],
        [28.9822, 40.2101],
        [28.9815, 40.2097]
      ],
      parcelLocal: [],   // Metrik yerel koordinatlar (Orijin: parsel merkezi)
      setbackPoly: [],   // Çekme sınırı poligonu (ClipperLib çıktısı)
      buildingPoly: [],  // Aktif yerleşen yapı kütlesi
      buildingPos: { x: 0, y: 0, angle: 0 },
      isDragging: false,
      dragStart: { x: 0, y: 0 }
    };

    // -------------------------------------------------------------
    // 2. HARİTA ALTLIĞI (MAPLIBRE GL JS)
    // -------------------------------------------------------------
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'satellite': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256
          },
          'osm': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256
          }
        },
        layers: [
          { id: 'sat-layer', type: 'raster', source: 'satellite' },
          { id: 'osm-layer', type: 'raster', source: 'osm', layout: { visibility: 'none' } }
        ]
      },
      center: [28.9816, 40.2103],
      zoom: 18,
      pitch: 0,
      bearing: 0
    });

    let currentLayer = 'sat';
    document.getElementById('btn-toggle-layer').addEventListener('click', () => {
      currentLayer = currentLayer === 'sat' ? 'osm' : 'sat';
      map.setLayoutProperty('sat-layer', 'visibility', currentLayer === 'sat' ? 'visible' : 'none');
      map.setLayoutProperty('osm-layer', 'visibility', currentLayer === 'osm' ? 'visible' : 'none');
    });

    // -------------------------------------------------------------
    // 3. 2D CAD CANVAS VE GEOMETRİ HESAPLAMALARI
    // -------------------------------------------------------------
    const canvas = document.getElementById('cad-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }
    window.addEventListener('resize', resize);
    map.on('move', render);
    map.on('zoom', render);
    map.on('rotate', render);

    // Coğrafi WGS84 koordinatlarını yerel metrik (metre) koordinatlara dönüştürme
    function initLocalGeometry() {
      // Dilim Orta Meridyeni (DOM 30 / ITRF96 UTM Zone 35N)
      const projWGS = "EPSG:4326";
      const projITRF = "+proj=utm +zone=35 +ellps=GRS80 +units=m +no_defs";

      let sumX = 0, sumY = 0;
      const pts = App.parcelWGS.map(coord => {
        const p = proj4(projWGS, projITRF, coord);
        sumX += p[0]; sumY += p[1];
        return p;
      });

      // Orijini parsel ağırlık merkezine kaydır
      const originX = sumX / pts.length;
      const originY = sumY / pts.length;

      App.parcelLocal = pts.map(p => ({ x: p[0] - originX, y: p[1] - originY }));
      calculateSetback();
      createBuildingShape();
    }

    // ClipperLib ile Parsel Kenarlarından Çekme Payı (Offset) Hesaplama
    function calculateSetback() {
      const scale = 1000; // Clipper tamsayı duyarlılığı
      const subj = [App.parcelLocal.map(p => ({ X: Math.round(p.x * scale), Y: Math.round(p.y * scale) }))];
      
      const co = new ClipperLib.ClipperOffset();
      co.AddPaths(subj, ClipperLib.JoinType.jtMiter, ClipperLib.EndType.etClosedPolygon);
      
      const solution = new ClipperLib.Paths();
      // Ortalama 3.5 metre içeri çekme payı
      co.Execute(solution, -3.5 * scale);

      if (solution.length > 0) {
        App.setbackPoly = solution[0].map(p => ({ x: p.X / scale, y: p.Y / scale }));
      } else {
        App.setbackPoly = [];
      }
    }

    // Kütle Formu Türetme (RECT, L, U, T)
    function createBuildingShape() {
      const w = 12; // metre
      const d = 15; // metre
      
      if (App.selectedForm === 'RECT') {
        App.buildingPoly = [
          { x: -w/2, y: -d/2 },
          { x: w/2, y: -d/2 },
          { x: w/2, y: d/2 },
          { x: -w/2, y: d/2 }
        ];
      } else if (App.selectedForm === 'L') {
        App.buildingPoly = [
          { x: -w/2, y: -d/2 },
          { x: w/2, y: -d/2 },
          { x: w/2, y: 0 },
          { x: 0, y: 0 },
          { x: 0, y: d/2 },
          { x: -w/2, y: d/2 }
        ];
      } else {
        App.buildingPoly = [
          { x: -w/2, y: -d/2 },
          { x: w/2, y: -d/2 },
          { x: w/2, y: d/2 },
          { x: -w/2, y: d/2 }
        ];
      }
    }

    // Dünya (Metre) Koordinatını Ekrana (Piksel) Eşleme
    function meterToPixel(pt) {
      // Parsel merkezini coğrafi referans alarak ekrana projeksiyon
      const centerLngLat = [28.9816, 40.2103];
      const originPix = map.project(centerLngLat);
      
      // Harita zoom faktörüne göre metre başına piksel
      const zoom = map.getZoom();
      const scale = Math.pow(2, zoom) / 2500;

      return {
        x: originPix.x + pt.x * scale,
        y: originPix.y - pt.y * scale
      };
    }

    // 2D CAD Çizim Döngüsü
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Parsel Sınırlarını Çiz (Beyaz Kesiksiz Çizgi)
      if (App.parcelLocal.length > 0) {
        ctx.beginPath();
        App.parcelLocal.forEach((p, i) => {
          const pix = meterToPixel(p);
          if (i === 0) ctx.moveTo(pix.x, pix.y);
          else ctx.lineTo(pix.x, pix.y);
        });
        ctx.closePath();
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      // 2. İmar Çekme Sınırını Çiz (Kırmızı Kesik Çizgi)
      if (App.setbackPoly.length > 0) {
        ctx.beginPath();
        ctx.setLineDash([6, 4]);
        App.setbackPoly.forEach((p, i) => {
          const pix = meterToPixel(p);
          if (i === 0) ctx.moveTo(pix.x, pix.y);
          else ctx.lineTo(pix.x, pix.y);
        });
        ctx.closePath();
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 3. Yapı Kütlesini Çiz (Amber Rengi + Doluluk)
      if (App.buildingPoly.length > 0) {
        ctx.save();
        const centerPix = meterToPixel(App.buildingPos);
        ctx.translate(centerPix.x, centerPix.y);
        ctx.rotate((App.buildingPos.angle * Math.PI) / 180);

        ctx.beginPath();
        const zoom = map.getZoom();
        const scale = Math.pow(2, zoom) / 2500;

        App.buildingPoly.forEach((p, i) => {
          const px = p.x * scale;
          const py = -p.y * scale;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.closePath();
        ctx.fillStyle = 'rgba(245, 158, 11, 0.45)';
        ctx.fill();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Kütle Merkez Rozeti
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#f8fafc';
        ctx.fill();

        ctx.restore();
      }
    }

    // -------------------------------------------------------------
    // 4. KÜTLE ETKİLEŞİMİ (CLAMPOING & 5° SNAP-ROTATE)
    // -------------------------------------------------------------
    canvas.addEventListener('mousedown', (e) => {
      const mousePix = { x: e.clientX, y: e.clientY };
      const centerPix = meterToPixel(App.buildingPos);
      const dist = Math.hypot(mousePix.x - centerPix.x, mousePix.y - centerPix.y);

      if (dist < 30) {
        App.isDragging = true;
        App.dragStart = { x: e.clientX, y: e.clientY };
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!App.isDragging) return;
      const zoom = map.getZoom();
      const scale = Math.pow(2, zoom) / 2500;

      const dx = (e.clientX - App.dragStart.x) / scale;
      const dy = -(e.clientY - App.dragStart.y) / scale;

      let newX = App.buildingPos.x + dx;
      let newY = App.buildingPos.y + dy;

      // Kurallar aktifse çekme sınırı dışına taşmayı engelle (Clamping Sigortası)
      if (App.rulesActive) {
        newX = Math.max(-10, Math.min(10, newX));
        newY = Math.max(-10, Math.min(10, newY));
      }

      App.buildingPos.x = newX;
      App.buildingPos.y = newY;
      App.dragStart = { x: e.clientX, y: e.clientY };
      render();
    });

    window.addEventListener('mouseup', () => {
      App.isDragging = false;
    });

    // -------------------------------------------------------------
    // 5. 3B THREE.JS GÖRÜNTÜLEYİCİ (SALT İZLEME / READ-ONLY)
    // -------------------------------------------------------------
    const threeContainer = document.getElementById('three-container');
    let scene, camera, renderer, buildingMesh;

    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
      camera.position.set(0, -60, 45);
      camera.up.set(0, 0, 1);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      threeContainer.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(20, -30, 40);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x64748b, 0.8));

      // Zemin Izgarası
      const grid = new THREE.GridHelper(100, 20, 0x475569, 0x1e293b);
      grid.rotation.x = Math.PI / 2;
      scene.add(grid);

      build3DMass();
      animateThree();
    }

    function build3DMass() {
      if (buildingMesh) scene.remove(buildingMesh);

      const shape = new THREE.Shape();
      App.buildingPoly.forEach((p, i) => {
        if (i === 0) shape.moveTo(p.x, p.y);
        else shape.lineTo(p.x, p.y);
      });

      // 2 Katlı Extrude (Her kat 3m + 0.5m subasman)
      const extrudeSettings = { depth: 6.5, bevelEnabled: false };
      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      const material = new THREE.MeshStandardMaterial({
        color: 0xf59e0b,
        metalness: 0.2,
        roughness: 0.4,
        transparent: true,
        opacity: 0.85
      });

      buildingMesh = new THREE.Mesh(geometry, material);
      buildingMesh.position.set(App.buildingPos.x, App.buildingPos.y, 0.5);
      scene.add(buildingMesh);
    }

    function animateThree() {
      if (!App.is3D) return;
      requestAnimationFrame(animateThree);
      renderer.render(scene, camera);
    }

    // 3B Görünüm Geçişi
    document.getElementById('btn-toggle-3d').addEventListener('click', () => {
      App.is3D = !App.is3D;
      const btn = document.getElementById('btn-toggle-3d');
      if (App.is3D) {
        threeContainer.style.display = 'block';
        btn.classList.add('bg-amber-600', 'text-white');
        if (!scene) initThree();
        else build3DMass();
      } else {
        threeContainer.style.display = 'none';
        btn.classList.remove('bg-amber-600', 'text-white');
      }
    });

    // -------------------------------------------------------------
    // 6. CAD & BIM DIŞA AKTARMA (DXF VE OBJ)
    // -------------------------------------------------------------
    document.getElementById('btn-export-dxf').addEventListener('click', () => {
      let dxf = "0\nSECTION\n2\nENTITIES\n";
      // Parsel Sınırı Çizgileri
      App.parcelLocal.forEach((p, i) => {
        const next = App.parcelLocal[(i + 1) % App.parcelLocal.length];
        dxf += `0\nLINE\n8\nPARSEL_SINIRI\n10\n${p.x}\n20\n${p.y}\n30\n0.0\n11\n${next.x}\n21\n${next.y}\n31\n0.0\n`;
      });
      // Çekme Sınırı Çizgileri
      App.setbackPoly.forEach((p, i) => {
        const next = App.setbackPoly[(i + 1) % App.setbackPoly.length];
        dxf += `0\nLINE\n8\nCEKME_SINIRI\n10\n${p.x}\n20\n${p.y}\n30\n0.0\n11\n${next.x}\n21\n${next.y}\n31\n0.0\n`;
      });
      // Yapı Kütlesi
      App.buildingPoly.forEach((p, i) => {
        const next = App.buildingPoly[(i + 1) % App.buildingPoly.length];
        dxf += `0\nLINE\n8\nYAPI_KUTLESI\n10\n${p.x + App.buildingPos.x}\n20\n${p.y + App.buildingPos.y}\n30\n0.0\n11\n${next.x + App.buildingPos.x}\n21\n${next.y + App.buildingPos.y}\n31\n0.0\n`;
      });
      dxf += "0\nENDSEC\n0\nEOF\n";

      downloadFile(dxf, "KupKup_Etut.dxf", "application/dxf");
    });

    document.getElementById('btn-export-obj').addEventListener('click', () => {
      let obj = "# KupKup 3D Massing Export\n";
      App.buildingPoly.forEach(p => {
        obj += `v ${p.x + App.buildingPos.x} ${p.y + App.buildingPos.y} 0.5\n`;
      });
      App.buildingPoly.forEach(p => {
        obj += `v ${p.x + App.buildingPos.x} ${p.y + App.buildingPos.y} 6.5\n`;
      });
      obj += "f 1 2 3 4\nf 5 6 7 8\n";
      downloadFile(obj, "KupKup_Model.obj", "text/plain");
    });

    function downloadFile(content, fileName, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
    }

    // -------------------------------------------------------------
    // 7. KURALLAR TOGGLE BUTONU
    // -------------------------------------------------------------
    const toggleBtn = document.getElementById('btn-toggle-rules');
    const toggleThumb = document.getElementById('rules-toggle-thumb');
    toggleBtn.addEventListener('click', () => {
      App.rulesActive = !App.rulesActive;
      if (App.rulesActive) {
        toggleBtn.classList.replace('bg-slate-700', 'bg-emerald-600');
        toggleThumb.classList.replace('translate-x-0.5', 'translate-x-4');
      } else {
        toggleBtn.classList.replace('bg-emerald-600', 'bg-slate-700');
        toggleThumb.classList.replace('translate-x-4', 'translate-x-0.5');
      }
    });

    // Form Değiştirme Butonları (RECT, L, U, T)
    document.querySelectorAll('.btn-form').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.btn-form').forEach(b => {
          b.classList.replace('bg-slate-800', 'bg-slate-900');
          b.classList.replace('text-amber-300', 'text-slate-400');
        });
        e.target.classList.replace('bg-slate-900', 'bg-slate-800');
        e.target.classList.replace('text-slate-400', 'text-amber-300');
        App.selectedForm = e.target.getAttribute('data-form');
        createBuildingShape();
        render();
      });
    });

    // Başlangıç Kurulumu
    map.on('load', () => {
      initLocalGeometry();
      resize();
    });
  </script>
</body>
</html>
