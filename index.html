<!DOCTYPE html>

<body class="bg-slate-900 text-slate-100 h-screen w-screen flex flex-col font-sans">

  <!-- 1. TAPU VE PROJE BARI (ÜST) -->
  <header class="h-12 glass-panel z-30 flex items-center justify-between px-3 text-xs">
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1.5 font-bold tracking-wider text-amber-400 text-sm">
        <span class="w-3 h-3 bg-amber-400 rounded-sm"></span> KüpKüp CAD
      </div>
      <div class="h-4 w-px bg-slate-700 mx-1"></div>
      
      <!-- 81 İL / İLÇE / MAHALLE ARDIŞIK SEÇİMİ -->
      <div class="flex items-center gap-1.5">
        <select id="sel-il" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 outline-none text-slate-200 text-xs w-28">

        <select id="sel-ilce" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 outline-none text-slate-200 text-xs w-28" disabled>
          <option value="">İlçe Seçiniz</option>
        </select>
        <select id="sel-mahalle" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 outline-none text-slate-200 text-xs w-32" disabled>
          <option value="">Mahalle Seçiniz</option>
        </select>
        <input type="text" id="inp-ada" placeholder="Ada" value="2145" class="w-14 bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-center outline-none text-slate-200 text-xs" />
        <input type="text" id="inp-parsel" placeholder="Parsel" value="12" class="w-14 bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-center outline-none text-slate-200 text-xs" />

          <i data-lucide="search" class="w-3 h-3"></i> Parseli Getir
        </button>
      </div>
    </div>

    <!-- Hızlı Başlat & Katman Değiştirici -->
    <div class="flex items-center gap-2">
      <button id="btn-wizard" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded flex items-center gap-1 shadow text-xs">
        <i data-lucide="sparkles" class="w-3 h-3"></i> Sihirbaz
      </button>
      <div class="h-4 w-px bg-slate-700 mx-1"></div>
      <button id="btn-toggle-layer" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2.5 py-1 rounded flex items-center gap-1 text-xs">
        <i data-lucide="layers" class="w-3 h-3 text-sky-400"></i> Uydu/Vektör
      </button>
    </div>
  </header>

  <!-- 2. İMAR ARAÇ VE KISIT BARI -->
  <section class="h-10 glass-panel z-30 flex items-center justify-between px-3 text-xs border-t-0">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5">
        <label class="text-slate-400">TAKS:</label>
        <input type="number" id="inp-taks" step="0.05" value="0.40" class="w-14 bg-slate-950 border border-slate-700 rounded px-1 py-0.5 text-center text-slate-200" />
        <label class="text-slate-400 ml-2">KAKS:</label>
        <input type="number" id="inp-kaks" step="0.1" value="1.20" class="w-14 bg-slate-950 border border-slate-700 rounded px-1 py-0.5 text-center text-slate-200" />
      </div>

      <div class="h-4 w-px bg-slate-700"></div>

      <div class="flex items-center gap-1.5">
        <label class="text-slate-400">Bahçe:</label>
        <input type="text" id="inp-kot-bahce" value="±0.00" class="w-12 bg-slate-950 border border-slate-700 rounded px-1 py-0.5 text-center text-slate-200" />
        <label class="text-slate-400 ml-1">Subasman:</label>
        <input type="text" id="inp-kot-zemin" value="+0.50m" class="w-14 bg-slate-950 border border-slate-700 rounded px-1 py-0.5 text-center text-slate-200" />
      </div>

      <div class="h-4 w-px bg-slate-700"></div>

      <!-- Katlar -->
      <div class="flex items-center gap-1" id="floor-tabs">

        <button class="px-2 py-0.5 bg-slate-900 text-slate-400 hover:text-slate-200 rounded border border-slate-800" data-floor="1">1. Kat (h:3.0m)</button>
        <button class="px-2 py-0.5 bg-slate-900 text-slate-400 hover:text-slate-200 rounded border border-slate-800" data-floor="2">Çatı</button>
      </div>

      <div class="h-4 w-px bg-slate-700"></div>

      <!-- Kural Sigortası -->
      <div class="flex items-center gap-2">
        <button id="btn-yonetmelik" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 rounded px-2 py-0.5 flex items-center gap-1">
          <i data-lucide="book-open" class="w-3 h-3 text-sky-400"></i> İmar Notu
        </button>

        <div class="flex items-center gap-1.5 bg-slate-950 border border-slate-800 rounded px-2 py-0.5">
          <span class="text-slate-400">Kurallar:</span>
          <button id="btn-toggle-rules" class="relative inline-flex h-4 w-8 items-center rounded-full bg-slate-700 transition">

          </button>
        </div>
      </div>
    </div>

      <div>Kütle: <span id="lbl-kutle" class="font-bold text-amber-400">180.00 m²</span></div>
    </div>
  </section>

    <div id="map"></div>
    <canvas id="cad-canvas"></canvas>
    <div id="three-container"></div>

        <span class="text-[10px] text-amber-400">V11 PRO</span>
      </div>

        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-slate-400">Kenar Çekme Payları (m):</label>
        <div class="grid grid-cols-3 gap-1">
          <div><span class="text-[10px] text-slate-500">Ön/Yol</span><input id="set-on" type="number" value="5.0" step="0.5" class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-center" /></div>

        </div>
      </div>

      <button id="btn-generate" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-1.5 rounded transition flex justify-center items-center gap-1 shadow">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 10 Varyasyon Türet

    </aside>

    <!-- SAĞ ALT: PROFESYONEL CAD ZOOM VE HİZALAMA BUTONLARI -->
    <div class="absolute right-4 bottom-6 z-30 flex flex-col gap-1.5 glass-panel p-1.5 rounded-lg shadow-2xl">
      <button id="btn-zoom-in" title="Yakınlaştır (+)" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded flex items-center justify-center font-bold text-base transition">
        <i data-lucide="plus" class="w-4 h-4"></i>
      </button>
      <button id="btn-zoom-out" title="Uzaklaştır (-)" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded flex items-center justify-center font-bold text-base transition">
        <i data-lucide="minus" class="w-4 h-4"></i>
      </button>
      <div class="w-full h-px bg-slate-700 my-0.5"></div>
      <button id="btn-zoom-fit" title="Parseli Ortala / Sığdır" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded flex items-center justify-center transition">
        <i data-lucide="focus" class="w-4 h-4"></i>
      </button>
    </div>

        <div class="text-[10px] text-slate-400 font-semibold mb-0.5">DIŞA AKTAR (CAD/BIM)</div>
        <button id="btn-export-dxf" class="w-full bg-slate-900 hover:bg-slate-800 text-left px-2 py-1 rounded text-slate-200 flex items-center justify-between border border-slate-800">

          <i data-lucide="download" class="w-3 h-3 text-slate-400"></i>
        </button>
        <button id="btn-export-obj" class="w-full bg-slate-900 hover:bg-slate-800 text-left px-2 py-1 rounded text-slate-200 flex items-center justify-between border border-slate-800">
          <span>3D Mesh (.OBJ)</span>
          <i data-lucide="download" class="w-3 h-3 text-slate-400"></i>
        </button>
      </div>
    </div>
  </main>

    const selIlce = document.getElementById('sel-ilce');
    const selMahalle = document.getElementById('sel-mahalle');

    TURKIYE_ILLER.forEach(il => {
      const opt = document.createElement('option');
      opt.value = il.plaka;
      opt.textContent = `${il.plaka} - ${il.ad}`;
      selIl.appendChild(opt);
    });

    selIl.addEventListener('change', (e) => {
      const plaka = e.target.value;
      selIlce.innerHTML = '<option value="">İlçe Seçiniz</option>';
      selMahalle.innerHTML = '<option value="">Mahalle Seçiniz</option>';
      selMahalle.disabled = true;

      if (!plaka) {
        selIlce.disabled = true;
        return;
      }

      selIlce.disabled = false;
      const ilceler = ILCE_KATALOG[plaka] || ["Merkez", "Merkez 2", "Kuzey", "Güney"];
      ilceler.forEach(ilce => {
        const opt = document.createElement('option');
        opt.value = ilce;
        opt.textContent = ilce;
        selIlce.appendChild(opt);
      });

      const seciliIl = TURKIYE_ILLER.find(i => i.plaka === plaka);
      if (seciliIl) {
        map.flyTo({ center: seciliIl.merkez, zoom: 12, speed: 1.2 });
      }
    });

    selIlce.addEventListener('change', (e) => {
      const ilce = e.target.value;
      selMahalle.innerHTML = '<option value="">Mahalle Seçiniz</option>';
      if (!ilce) {
        selMahalle.disabled = true;
        return;
      }
      selMahalle.disabled = false;
      const mahalleler = MAHALLE_KATALOG[ilce] || ["Cumhuriyet", "Atatürk", "Yeni Mahalle", "Zafer"];
      mahalleler.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        selMahalle.appendChild(opt);
      });
    });

    // -------------------------------------------------------------
    // UYGULAMA DURUMU (CAD STATE)
    // -------------------------------------------------------------
    const App = {
      rulesActive: false,
      is3D: false,
      selectedForm: 'RECT',
      parcelWGS: [
        [28.9812, 40.2105],
        [28.9818, 40.2108],
        [28.9822, 40.2101],
        [28.9815, 40.2097]
      ],
      parcelLocal: [],
      setbackPoly: [],
      buildingPoly: [],
      buildingPos: { x: 0, y: 0, angle: 0 },
      isDragging: false,
      dragStart: { x: 0, y: 0 }
    };

    // -------------------------------------------------------------
    // HARİTA ALTLIĞI (MAPLIBRE GL JS)
    // -------------------------------------------------------------
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'satellite': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256
          },
          'osm': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256
          }
        },
        layers: [
          { id: 'sat-layer', type: 'raster', source: 'satellite' },
          { id: 'osm-layer', type: 'raster', source: 'osm', layout: { visibility: 'none' } }
        ]
      },
      center: [28.9816, 40.2103],
      zoom: 18,
      pitch: 0,
      bearing: 0
    });

    let currentLayer = 'sat';
    document.getElementById('btn-toggle-layer').addEventListener('click', () => {
      currentLayer = currentLayer === 'sat' ? 'osm' : 'sat';
      map.setLayoutProperty('sat-layer', 'visibility', currentLayer === 'sat' ? 'visible' : 'none');
      map.setLayoutProperty('osm-layer', 'visibility', currentLayer === 'osm' ? 'visible' : 'none');
    });

    // -------------------------------------------------------------
    // SAĞ ALT ZOOM VE ORTALAMA BUTONLARI (CAD & HARİTA SENKRON)
    // -------------------------------------------------------------
    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      map.zoomIn({ duration: 300 });
    });

    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      map.zoomOut({ duration: 300 });
    });

    document.getElementById('btn-zoom-fit').addEventListener('click', () => {
      map.flyTo({ center: [28.9816, 40.2103], zoom: 18.5, pitch: 0, bearing: 0 });
    });

    document.getElementById('btn-sorgula').addEventListener('click', () => {
      map.flyTo({ center: [28.9816, 40.2103], zoom: 19, speed: 1.2 });
    });

    // -------------------------------------------------------------
    // 2D CAD CANVAS GEOMETRİSİ
    // -------------------------------------------------------------
    const canvas = document.getElementById('cad-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }
    window.addEventListener('resize', resize);
    map.on('move', render);
    map.on('zoom', render);
    map.on('rotate', render);

    function initLocalGeometry() {
      const projWGS = "EPSG:4326";
      const projITRF = "+proj=utm +zone=35 +ellps=GRS80 +units=m +no_defs";

      let sumX = 0, sumY = 0;
      const pts = App.parcelWGS.map(coord => {
        const p = proj4(projWGS, projITRF, coord);
        sumX += p[0]; sumY += p[1];
        return p;
      });

      const originX = sumX / pts.length;
      const originY = sumY / pts.length;

      App.parcelLocal = pts.map(p => ({ x: p[0] - originX, y: p[1] - originY }));
      calculateSetback();
      createBuildingShape();
    }

    function calculateSetback() {
      const scale = 1000;
      const subj = [App.parcelLocal.map(p => ({ X: Math.round(p.x * scale), Y: Math.round(p.y * scale) }))];
      const co = new ClipperLib.ClipperOffset();
      co.AddPaths(subj, ClipperLib.JoinType.jtMiter, ClipperLib.EndType.etClosedPolygon);
      
      const solution = new ClipperLib.Paths();
      co.Execute(solution, -3.5 * scale);

      if (solution.length > 0) {
        App.setbackPoly = solution[0].map(p => ({ x: p.X / scale, y: p.Y / scale }));
      } else {
        App.setbackPoly = [];
      }
    }

    function createBuildingShape() {
      const w = 12;
      const d = 15;
      
      if (App.selectedForm === 'RECT') {
        App.buildingPoly = [
          { x: -w/2, y: -d/2 },
          { x: w/2, y: -d/2 },
          { x: w/2, y: d/2 },
          { x: -w/2, y: d/2 }
        ];
      } else if (App.selectedForm === 'L') {
        App.buildingPoly = [
          { x: -w/2, y: -d/2 },
          { x: w/2, y: -d/2 },
          { x: w/2, y: 0 },
          { x: 0, y: 0 },
          { x: 0, y: d/2 },
          { x: -w/2, y: d/2 }
        ];
      } else {
        App.buildingPoly = [
          { x: -w/2, y: -d/2 },
          { x: w/2, y: -d/2 },
          { x: w/2, y: d/2 },
          { x: -w/2, y: d/2 }
        ];
      }
    }

    function meterToPixel(pt) {
      const centerLngLat = [28.9816, 40.2103];
      const originPix = map.project(centerLngLat);
      const zoom = map.getZoom();
      const scale = Math.pow(2, zoom) / 2500;

      return {
        x: originPix.x + pt.x * scale,
        y: originPix.y - pt.y * scale
      };
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Parsel Sınırı (Beyaz)
      if (App.parcelLocal.length > 0) {
        ctx.beginPath();
        App.parcelLocal.forEach((p, i) => {
          const pix = meterToPixel(p);
          if (i === 0) ctx.moveTo(pix.x, pix.y);
          else ctx.lineTo(pix.x, pix.y);
        });
        ctx.closePath();
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      // Çekme Sınırı (Kırmızı Kesik)
      if (App.setbackPoly.length > 0) {
        ctx.beginPath();
        ctx.setLineDash([6, 4]);
        App.setbackPoly.forEach((p, i) => {
          const pix = meterToPixel(p);
          if (i === 0) ctx.moveTo(pix.x, pix.y);
          else ctx.lineTo(pix.x, pix.y);
        });
        ctx.closePath();
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Kütle (Amber)
      if (App.buildingPoly.length > 0) {
        ctx.save();
        const centerPix = meterToPixel(App.buildingPos);
        ctx.translate(centerPix.x, centerPix.y);
        ctx.rotate((App.buildingPos.angle * Math.PI) / 180);

        ctx.beginPath();
        const zoom = map.getZoom();
        const scale = Math.pow(2, zoom) / 2500;

        App.buildingPoly.forEach((p, i) => {
          const px = p.x * scale;
          const py = -p.y * scale;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.closePath();
        ctx.fillStyle = 'rgba(245, 158, 11, 0.45)';
        ctx.fill();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#f8fafc';
        ctx.fill();

        ctx.restore();
      }
    }

    // Kütle Taşıma
    canvas.addEventListener('mousedown', (e) => {
      const mousePix = { x: e.clientX, y: e.clientY };
      const centerPix = meterToPixel(App.buildingPos);
      const dist = Math.hypot(mousePix.x - centerPix.x, mousePix.y - centerPix.y);

      if (dist < 30) {
        App.isDragging = true;
        App.dragStart = { x: e.clientX, y: e.clientY };
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!App.isDragging) return;
      const zoom = map.getZoom();
      const scale = Math.pow(2, zoom) / 2500;

      const dx = (e.clientX - App.dragStart.x) / scale;
      const dy = -(e.clientY - App.dragStart.y) / scale;

      App.buildingPos.x += dx;
      App.buildingPos.y += dy;
      App.dragStart = { x: e.clientX, y: e.clientY };
      render();
    });

    window.addEventListener('mouseup', () => {
      App.isDragging = false;
    });

    // -------------------------------------------------------------
    // THREE.JS 3B SAHNE
    // -------------------------------------------------------------
    const threeContainer = document.getElementById('three-container');
    let scene, camera, renderer, buildingMesh;

    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
      camera.position.set(0, -60, 45);
      camera.up.set(0, 0, 1);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      threeContainer.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(20, -30, 40);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x64748b, 0.8));

      const grid = new THREE.GridHelper(100, 20, 0x475569, 0x1e293b);
      grid.rotation.x = Math.PI / 2;
      scene.add(grid);

      build3DMass();
      animateThree();
    }

    function build3DMass() {
      if (buildingMesh) scene.remove(buildingMesh);

      const shape = new THREE.Shape();
      App.buildingPoly.forEach((p, i) => {
        if (i === 0) shape.moveTo(p.x, p.y);
        else shape.lineTo(p.x, p.y);
      });

      const extrudeSettings = { depth: 6.5, bevelEnabled: false };
      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      const material = new THREE.MeshStandardMaterial({
        color: 0xf59e0b,
        metalness: 0.2,
        roughness: 0.4,
        transparent: true,
        opacity: 0.85
      });

      buildingMesh = new THREE.Mesh(geometry, material);
      buildingMesh.position.set(App.buildingPos.x, App.buildingPos.y, 0.5);
      scene.add(buildingMesh);
    }

    function animateThree() {
      if (!App.is3D) return;
      requestAnimationFrame(animateThree);
      renderer.render(scene, camera);
    }

    document.getElementById('btn-toggle-3d').addEventListener('click', () => {
      App.is3D = !App.is3D;
      const btn = document.getElementById('btn-toggle-3d');
      if (App.is3D) {
        threeContainer.style.display = 'block';
        btn.classList.add('bg-amber-600', 'text-white');
        if (!scene) initThree();
        else build3DMass();
      } else {
        threeContainer.style.display = 'none';
        btn.classList.remove('bg-amber-600', 'text-white');
      }
    });

    // -------------------------------------------------------------
    // DXF VE OBJ ÇIKTILARI
    // -------------------------------------------------------------
    document.getElementById('btn-export-dxf').addEventListener('click', () => {
      let dxf = "0\nSECTION\n2\nENTITIES\n";
      App.parcelLocal.forEach((p, i) => {
        const next = App.parcelLocal[(i + 1) % App.parcelLocal.length];
        dxf += `0\nLINE\n8\nPARSEL_SINIRI\n10\n${p.x}\n20\n${p.y}\n30\n0.0\n11\n${next.x}\n21\n${next.y}\n31\n0.0\n`;
      });
      App.setbackPoly.forEach((p, i) => {
        const next = App.setbackPoly[(i + 1) % App.setbackPoly.length];
        dxf += `0\nLINE\n8\nCEKME_SINIRI\n10\n${p.x}\n20\n${p.y}\n30\n0.0\n11\n${next.x}\n21\n${next.y}\n31\n0.0\n`;
      });
      App.buildingPoly.forEach((p, i) => {
        const next = App.buildingPoly[(i + 1) % App.buildingPoly.length];
        dxf += `0\nLINE\n8\nYAPI_KUTLESI\n10\n${p.x + App.buildingPos.x}\n20\n${p.y + App.buildingPos.y}\n30\n0.0\n11\n${next.x + App.buildingPos.x}\n21\n${next.y + App.buildingPos.y}\n31\n0.0\n`;
      });
      dxf += "0\nENDSEC\n0\nEOF\n";
      downloadFile(dxf, "KupKup_Parsel_Etut.dxf", "application/dxf");
    });

    document.getElementById('btn-export-obj').addEventListener('click', () => {
      let obj = "# KupKup 3D Massing Export\n";
      App.buildingPoly.forEach(p => {
        obj += `v ${p.x + App.buildingPos.x} ${p.y + App.buildingPos.y} 0.5\n`;
      });
      App.buildingPoly.forEach(p => {
        obj += `v ${p.x + App.buildingPos.x} ${p.y + App.buildingPos.y} 6.5\n`;
      });
      obj += "f 1 2 3 4\nf 5 6 7 8\n";
      downloadFile(obj, "KupKup_Model.obj", "text/plain");
    });

    function downloadFile(content, fileName, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
    }

    // Başlangıç
    map.on('load', () => {
      initLocalGeometry();
      resize();
    });
  </script>
</body>
</html>
